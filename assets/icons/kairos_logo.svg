<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Theme red gradient -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5555"/>
      <stop offset="100%" stop-color="#FF4444"/>
    </linearGradient>
  </defs>
  
  <!-- Kairos/egg outline -->
  <path d="M50 10 
           C25 10, 15 35, 15 55 
