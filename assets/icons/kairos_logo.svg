        stroke="url(#redGradient)" 
        stroke-width="3"
        stroke-linecap="round"/>
  
  <!-- Heart inside -->
  <path d="M50 40 
           C50 40, 42 32, 36 38 
           C30 44, 30 52, 50 68 
           C70 52, 70 44, 64 38 
